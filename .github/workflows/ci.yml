name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Scripts de la consultora
        run: node --test "scripts/**/*.test.mjs"
      # Los pasos del proyecto no corren en la plantilla (no tiene código de producto) ni en un proyecto que todavía no
      # cargó comandos en comandos.env (fase de Inicio, sin stack decidido). Con uno cargado, se exigen todos.
      - name: Comandos del proyecto
        id: comandos
        if: ${{ !github.event.repository.is_template }}
        run: bash scripts/comandos-declarados.sh >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh INSTALAR opcional
      - name: Formato
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh FORMATO_CHECK
      - name: Linter
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh LINT
      - name: Tipos
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh TIPOS opcional
      - name: Tests (unitarias y aceptación)
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh TESTS
      - name: Tests de integración
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        run: bash scripts/correr-comando.sh TESTS_INTEGRACION opcional
      - name: Cobertura (informativa)
        if: ${{ !github.event.repository.is_template && steps.comandos.outputs.declarados == 'si' }}
        continue-on-error: true
        run: bash scripts/correr-comando.sh COBERTURA opcional >> "$GITHUB_STEP_SUMMARY"
