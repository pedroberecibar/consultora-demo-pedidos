name: Rollback
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag a volver a desplegar (por ejemplo, v1.2.0)
        required: true
permissions:
  contents: read
concurrency:
  group: produccion
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production   # Repos privados con plan Free: borrar esta línea (ADR-0006 de la consultora).
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # El tag entra por variable de entorno y se valida: nunca se interpola dentro del script.
      - name: Validar el tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag no válido: $TAG (formato vX.Y.Z)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash scripts/correr-comando.sh INSTALAR opcional
      - name: Desplegar
        env:
          VERSION: ${{ env.TAG }}
        run: bash scripts/correr-comando.sh DEPLOY_PRODUCCION
      - name: Smoke
        env:
          ENTORNO: produccion
        run: bash scripts/correr-comando.sh SMOKE
